  {lb:true,orb:.4,split:.25,labels:[lab('4–5 học sinh',()=>new V3(-1.7,3.0,10.3),'#ffc928'),lab('Giáo viên',()=>new V3(3.3,3.45,10.7),'#2fe3c8')],anim(t,s){s.x=15;s.bloom=1}});
const SCENES=[SIM[0],UNIS,I1,I2,I3,I4,I5,II1,II2,II3,III0,G1,SIM[1],SIM[2],G2,SIM[3],SIM[4],G3,SIM[5],SIM[6],SIM[7],G4,SIM[8],SIM[9],G5,SIM[10]];
const STEPN=['','Tiếp nhận tình huống','Thử số & mâu thuẫn','Mô hình hóa','Thảo luận & kết quả','Tổng kết'];

/* ============ Sound (WebAudio tổng hợp bằng code) ============ */
const SFX=(()=>{let a,mg,nb,on=true,bt;
  const btn=()=>$('#snd').textContent=on?'🔊':'🔇';
  function noise(d,type,f0,f1,v,delay){if(!a||!on)return;const t=a.currentTime+(delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=nb;f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);f.Q.value=1.2;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.35);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random());s.stop(t+d+.05)}
  function tone(fr,d,type,v,delay,to){if(!a||!on)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
  function chirp(){if(a&&on){const f=2400+Math.random()*1400,n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)tone(f,.09,'sine',.025,i*.13,f*1.5)}bt=setTimeout(chirp,2500+Math.random()*5000)}
  function init(){if(a){a.state==='suspended'&&a.resume();return}
    a=new(window.AudioContext||window.webkitAudioContext)();mg=a.createGain();mg.gain.value=on?.8:0;mg.connect(a.destination);
    nb=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    /* sông: nhiễu lọc thấp + sóng chậm */
    const rv=a.createBufferSource(),lp=a.createBiquadFilter(),rg=a.createGain(),lf=a.createOscillator(),lg=a.createGain();
    rv.buffer=nb;rv.loop=true;lp.type='lowpass';lp.frequency.value=650;rg.gain.value=.09;lf.frequency.value=.17;lg.gain.value=.04;
    lf.connect(lg);lg.connect(rg.gain);rv.connect(lp);lp.connect(rg);rg.connect(mg);rv.start();lf.start();
    /* pad hoàng hôn nhẹ */
    [110,164.8,220.4].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.012;o.connect(g);g.connect(mg);o.start()});
    btn()}
  return{init,
    toggle(){on=!on;if(mg)mg.gain.setTargetAtTime(on?.8:0,a.currentTime,.1);btn()},
    whoosh(){noise(1,'bandpass',250,2600,.22)},
    pop(){tone(520,.14,'sine',.025,0,640)},
    tick(){tone(700,.06,'sine',.03)},
    clank(){tone(190,.25,'triangle',.18);tone(1250,.4,'sine',.05);noise(.12,'highpass',2000,5000,.12)},
    buzz(){tone(120,.3,'sawtooth',.07);tone(110,.35,'sawtooth',.07,.38)},
    chime(){[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,.9,'triangle',.07,i*.13))}}})();
['pointerdown','keydown','touchend'].forEach(e=>addEventListener(e,()=>SFX.init()));
$('#snd').onclick=e=>{SFX.init();SFX.toggle();e.target.blur()};
/* ============ UI ============ */
const lay=$('#lay'),hud=$('#hud'),gc=$('#graph'),g2=gc.getContext('2d');
let cur=-1,t0=0,st={},sc=null,blocksEl=[],labEl=[],auto=false;
const prog=$('#prog');SCENES.forEach((s,i)=>{const d=document.createElement('i');d.style.left=(i+.5)/SCENES.length*100+'%';d.onclick=()=>go(i);prog.appendChild(d)});
function go(i,first){i=cl(i,0,SCENES.length-1);if(i===cur&&!first)return;
  blocksEl.forEach(b=>{b.el.classList.add('out');setTimeout(()=>b.el.remove(),700)});labEl.forEach(l=>l.el.remove());blocksEl=[];labEl=[];
  cur=i;sc=SCENES[i];t0=clock.elapsedTime;st={x:15,bloom:0,col:0xffc928,glow:0,build:3,hud:-1,graph:0};
  Object.keys(Wd).forEach(k=>Wd[k].visible=sc.show.includes(k));main.g.visible=sc.show.includes('main');
  main.sd.forEach((s,j)=>s.visible=j<3);
  (sc.blocks||[]).forEach(b=>{const el=document.createElement('div');el.className='blk pos-'+b.pos;
    const ls=b.lines.map(l=>{const sp=document.createElement('span');sp.className='ln '+l[2];sp.innerHTML=l[0];el.appendChild(sp);return{el:sp,at:l[1]}});
    lay.appendChild(el);blocksEl.push({el,ls})});
  if(sc.panel){const el=document.createElement('div');el.className='pnl '+sc.panel.cls;el.innerHTML=sc.panel.html;const rv=[...el.querySelectorAll('.rv')];
    const ls=rv.map((e,k)=>({el:e,at:e.dataset.at?+e.dataset.at:.7+k*.42}));lay.appendChild(el);blocksEl.push({el,ls})}
  (sc.labels||[]).forEach(l=>{const el=document.createElement('div');el.className='lb';el.textContent=l[0];el.style.setProperty('--c',l[2]);lay.appendChild(el);labEl.push({el,f:l[1],v:new V3()})});
  document.body.classList.toggle('x',false);stage.classList.toggle('lbon',!!sc.lb);
  const b=$('#badge');b.style.opacity=(sc.tag||sc.step)?1:0;b.textContent=sc.tag||('BƯỚC '+sc.step+'/5 · '+STEPN[sc.step]);
  $('#notes').textContent=sc.notes;
  $('#fill').style.width=(i+1)/SCENES.length*100+'%';[...prog.querySelectorAll('i')].forEach((d,j)=>d.classList.toggle('on',j<=i));
  R.s0.copy(camera.position);R.l0.copy(R.lt);R.f0=R.sf;
  if(first){goal(sc,0);R.s0.copy(R.g.p);R.l0.copy(R.g.t);R.f0=R.g.f}
  if(!first)SFX.whoosh();try{history.replaceState(null,'','#scene-'+i)}catch(e){}}
const nx=()=>go(cur+1),pv=()=>go(cur-1);
addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();nx()}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();pv()}
  else if(/^[0-9]$/.test(k))go(+k);else if(k==='Home')go(0);else if(k==='End')go(SCENES.length-1);
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
  else if(k==='p'||k==='P')auto=!auto;else if(k==='m'||k==='M')SFX.toggle();else if(k==='n'||k==='N'){const n=$('#notes');n.style.display=n.style.display==='block'?'none':'block'}});
$('#prev').onclick=e=>{e.target.blur();pv()};$('#next').onclick=e=>{e.target.blur();nx()};
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)d<0?nx():pv()},{passive:true});
addEventListener('hashchange',()=>{const m=location.hash.match(/scene-(\d+)/);if(m)go(+m[1])});
let ct;addEventListener('mousemove',()=>{document.body.classList.remove('nocur');clearTimeout(ct);ct=setTimeout(()=>document.body.classList.add('nocur'),3000)});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(w,h)}ffM.uniforms.px.value=renderer.getPixelRatio()*h/720;camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function drawGraph(x){const W=1000,H=640,px=70,py=50,X=v=>px+v/30*(W-px-30),Y=v=>H-py-v/500*(H-py-40);g2.clearRect(0,0,W,H);
  g2.font='26px "Be Vietnam Pro",Arial';g2.strokeStyle='rgba(255,248,234,.2)';g2.fillStyle='#fff8ea';g2.lineWidth=1;
  for(let v=0;v<=500;v+=100){g2.beginPath();g2.moveTo(px,Y(v));g2.lineTo(W-30,Y(v));g2.stroke();g2.fillText(v,8,Y(v)+8)}
  for(let v=0;v<=30;v+=5)g2.fillText(v,X(v)-10,H-14);
  g2.strokeStyle='#fff8ea';g2.lineWidth=3;g2.beginPath();g2.moveTo(px,40);g2.lineTo(px,H-py);g2.lineTo(W-30,H-py);g2.stroke();g2.fillText('S (m²)',px+8,34);g2.fillText('x (m)',W-110,H-py-10);
  g2.strokeStyle='#ffc928';g2.lineWidth=5;g2.beginPath();for(let v=0;v<=30;v+=.25){v?g2.lineTo(X(v),Y(S(v))):g2.moveTo(X(v),Y(S(v)))}g2.stroke();
  [[5,250],[10,400],[15,450],[20,400]].forEach(p=>{const pk=p[0]===15,pu=pk?1+.35*Math.sin(clock.elapsedTime*6):1;g2.fillStyle=pk?'#8cffb0':'#fff8ea';g2.beginPath();g2.arc(X(p[0]),Y(p[1]),(pk?11:8)*pu,0,6.3);g2.fill();g2.fillText('('+p[0]+'; '+p[1]+')',X(p[0])-50,Y(p[1])-20)});
  g2.fillStyle='#ff6a2a';g2.beginPath();g2.arc(X(x),Y(S(x)),12,0,6.3);g2.fill()}

/* ============ Loop ============ */
const tmp=new V3(),sunEl=$('#sun');let lastX=-1;
function animChars(dt,tm,ts){
  if(Wd.farmer.visible){let mode='talk',yaw=.22;
    if(sc.fm==='greet'){if(ts<3.5){mode='greet'}else if(ts<7){mode='point';yaw=2.6}else{mode='pointDown';yaw=1.4}}
    Wd.farmer.rotation.y+=(yaw-Wd.farmer.rotation.y)*(1-Math.exp(-dt*3));pose(Wd.farmer,tm,mode,dt)}
  if(Wd.students.visible){const sp=Math.floor(ts/3)%5;kids.forEach((k,i)=>pose(k,tm,i===sp?'talk':(i===3&&ts>5?'raise':'listen'),dt))}
  palms.forEach((q,i)=>q.rotation.z=Math.sin(tm*.8+i)*.02)}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.1),tm=clock.elapsedTime,ts=tm-t0;
  water.material.uniforms.t.value=tm;boat.position.y=-.3+Math.sin(tm*1.4)*.06;boat.rotation.z=Math.sin(tm*1.1)*.03;
  sc.anim&&sc.anim(ts,st);
  const ev=(k,c,f)=>{if(c&&!st['_'+k]){st['_'+k]=1;f()}};
  if(sc.id===2&&st.build!==st._b){st._b=st.build;if(st.build)SFX.clank()}
  if(sc.id===3&&st.hud!==st._h){st._h=st.hud;if(st.hud>0)SFX.chime()}
  ev('bz',sc.id===4&&ts>1.6,SFX.buzz);ev('pk',sc.id===6&&ts>9,SFX.chime);ev('ok',sc.id===9&&ts>4.5,SFX.chime);ev('fin',sc.id===10&&ts>6.5,SFX.chime);
  if(sc.id===9&&st.n!==st._n){st._n=st.n;if(st.n%15===0&&st.n<450)SFX.tick()}
if(auto&&ts>sc.dur&&cur<SCENES.length-1)nx();
  const x=cl(st.x,.3,29.7),w=x,L=60-2*x;main.setSize(w,L);console.assert(Math.abs(main.perim3()-60)<1e-9,'chu vi lưới');
  main.setColor(st.col);main.sd.forEach((s,j)=>s.visible=j<3&&(sc.id!==2||j<st.build));
  const gl=st.glow?.5+.5*Math.sin(tm*5):.35;Wd.bank.material.opacity=gl;Wd.bank.scale.y=st.glow?1+gl*2:1;
  if(Wd.land.visible)updFlowers(w,L,st.bloom,dt);if(Wd.dims.visible)updDims(w,L);
  Wd.board3d.position.y=6+Math.sin(tm)*.15;
  animChars(dt,tm,ts);rig(sc,ts,tm);
  const W=stage.clientWidth,H=stage.clientHeight;if(sc.split)camera.setViewOffset(W,H,W*sc.split,0,W,H);else camera.clearViewOffset();camera.updateProjectionMatrix();camera.updateMatrixWorld();
  blocksEl.forEach(b=>b.ls.forEach(l=>{if(ts>=l.at+.4&&!l.el.classList.contains('on')){l.el.classList.add('on');SFX.pop()}}));
  labEl.forEach(l=>{l.v.copy(l.f());tmp.copy(l.v).project(camera);l.el.style.left=(tmp.x*.5+.5)*100+'%';l.el.style.top=(1-(tmp.y*.5+.5))*100+'%';l.el.style.opacity=ts>1.2&&tmp.z<1?1:0});
  hud.style.display=st.hudOn?'block':'none';
  if(st.hudOn){[...hud.querySelectorAll('tr.r')].forEach((r,i)=>r.classList.toggle('on',i<st.hud));$('#live').textContent='x = '+Math.round(x)+' · dài = '+Math.round(L)+' · S = '+Math.round(S(x))}
  gc.style.display=st.graph?'block':'none';if(st.graph)drawGraph(x);
  tmp.copy(sunDir).multiplyScalar(300).add(camera.position).project(camera);
  sunEl.style.display=tmp.z<1?'block':'none';sunEl.style.left=(tmp.x*.5+.5)*100+'%';sunEl.style.top=(1-(tmp.y*.5+.5))*100+'%';
  FXR(tm,dt)}
resize();
const m0=location.hash.match(/scene-(\d+)/);go(m0?+m0[1]:0,true);
requestAnimationFrame(()=>requestAnimationFrame(()=>$('#load').classList.add('gone')));
frame();
